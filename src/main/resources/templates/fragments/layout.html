<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:fragment="pagina(titulo, conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' - Question Mark'">Question Mark</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <header class="cabecalho-layout">
        <a th:href="@{/home}" class="marca-layout">❓ Question Mark</a>
    </header>

    <div class="conteudo-layout">
        <th:block th:replace="${conteudo}" />
    </div>

    <footer class="rodape-layout">
        Instituto Federal da Paraíba <span class="badge">IFPB</span>
    </footer>
</body>
</html>
