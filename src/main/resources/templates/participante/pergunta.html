<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Question Mark - Corrida</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="page-wrapper">
    <div class="card">
        <div th:if="${mensagem}" class="alert-success" th:text="${mensagem}"></div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="badge" th:text="'Pergunta ' + ${indiceAtual} + ' de ' + ${totalPerguntas}"></span>
            <div id="timer" style="font-weight: 700; color: var(--danger); font-size: 1.2rem;">--:--</div>
        </div>

        <div class="divider"></div>

        <h2 class="pergunta-enunciado" th:text="${pergunta.enunciado}"></h2>

        <form th:if="${acertou == null}" th:action="@{/corridas/{id}/pergunta(id=${pergunta.corrida.id})}" method="post">
            
            <div th:each="alt, stat : ${pergunta.alternativas}">
                <label class="card-detalhes" style="justify-content: flex-start; gap: 15px; cursor: pointer;">
                    <input type="radio" name="resposta" th:value="${stat.index}" required style="accent-color: var(--purple-primary); transform: scale(1.2);" />
                    <span th:text="${alt}" style="font-weight: 500;"></span>
                </label>
            </div>
            
            <button type="submit" class="btn btn-block" style="margin-top: 15px;">Responder ✅</button>
        </form>

        <div th:if="${acertou != null}">
            
            <div th:if="${acertou}" class="flash-ok">
                <span style="font-size: 1.2em;">✅ Acertou!</span><br>
                Você ganhou <b th:text="${ponto}"></b> pontos.
            </div>

            <div th:unless="${acertou}" class="flash-erro">
                <span style="font-size: 1.2em;">❌ Errou!</span><br>
                A resposta correta era: <b th:text="${respostaCorreta}"></b>
            </div>

            <form th:action="@{/corridas/{id}/pergunta/proxima(id=${pergunta.corrida.id})}" method="post">
                <button type="submit" class="btn btn-block">Próxima Pergunta ➡</button>
            </form>
        </div>

    </div>
</div>

<script th:inline="javascript">
    let restante = [[${tempoRestante}]];
    
    function atualizarTimer() {
        if (restante <= 0) {
            document.getElementById('timer').innerHTML = "TEMPO ESGOTADO!";
            window.location.reload(); 
            return;
        }

        const min = Math.floor(restante / 60);
        const seg = restante % 60;
        document.getElementById('timer').innerHTML = 
            "⏱ " + (min < 10 ? '0' : '') + min + ":" + (seg < 10 ? '0' : '') + seg;
            
        restante--;
    }

    setInterval(atualizarTimer, 1000);
    atualizarTimer();
</script>

</body>
</html>
