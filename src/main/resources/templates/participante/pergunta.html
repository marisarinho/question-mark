<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Question Mark - Corrida</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="page-wrapper">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 th:text="'Pergunta ' + ${indiceAtual} + ' de ' + ${totalPerguntas}"></h3>
            <div id="timer" style="font-weight: bold; color: #d9534f; font-size: 1.2em;">--:--</div>
        </div>
        
        <div class="divider"></div>

        <h2 th:text="${pergunta.enunciado}"></h2>

        <form th:action="@{/corridas/{id}/pergunta(id=${pergunta.corrida.id})}" method="post">
            <div th:each="alt, stat : ${pergunta.alternativas}" style="margin-bottom: 10px;">
                <label class="card-detalhes" style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px; border: 1px solid #eee; border-radius: 5px;">
                    <input type="radio" name="resposta" th:value="${stat.index}" required />
                    <span th:text="${alt}"></span>
                </label>
            </div>

            <button type="submit" class="btn" style="margin-top: 20px;">Próxima Pergunta ➡</button>
        </form>
    </div>
</div>

<script th:inline="javascript">
    //pegando direto do controllere
    let restante = [[${tempoRestante}]];
    
    function atualizarTimer() {
        if (restante <= 0) {
            document.getElementById('timer').innerHTML = "TEMPO ESGOTADO!";
            window.location.reload(); 
            return;
        }

        const min = Math.floor(restante / 60);
        const seg = restante % 60;
        document.getElementById('timer').innerHTML = 
            (min < 10 ? '0' : '') + min + ":" + (seg < 10 ? '0' : '') + seg;
            
        restante--;
    }

    setInterval(atualizarTimer, 1000);
    atualizarTimer();
</script>

</body>
</html>
