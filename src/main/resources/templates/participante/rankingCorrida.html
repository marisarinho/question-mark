<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ranking da Corrida - Question Mark</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

    <div class="lobby-header">
        <h2 class="titulo-pagina" style="margin-bottom: 5px;">🏆 Ranking: <span th:text="${corrida.titulo}"></span></h2>
        
        <div class="acoes-topo">
            <a th:href="@{/corridas/ranking}" class="btn">🏆 Ver Ranking Geral</a>
            <a th:href="@{/home}" class="btn btn-secundario">⬅ Voltar</a>
        </div>
    </div>

    <div style="max-width: 900px; margin: 0 auto;">
        
        <div class="card">

            <div th:if="${#lists.isEmpty(ranking)}" class="empty-state">
                <h3 style="color: var(--purple-primary); margin-bottom: 10px;">Ainda não há campeões!</h3>
                <p>Nenhum resultado cadastrado para essa corrida ainda.</p>
            </div>

            <div th:unless="${#lists.isEmpty(ranking)}">

                <div th:unless="${temResultado}" class="flash-erro" style="background-color: #fff9f5; color: var(--warning); border-left-color: var(--warning);">
                    Você ainda não participou dessa corrida!
                </div>

            <form class="form-tamanho-pagina" th:action="@{/corridas/{id}/ranking(id=${corrida.id})}" method="get">                    
                <label for="size">Linhas por página:</label>
                    <select id="size" name="size" onchange="this.form.submit()">
                        <option th:each="opcao : ${opcoesTamanho}"
                                th:value="${opcao}"
                                th:text="${opcao}"
                                th:selected="${opcao == tamanhoPagina}">
                        </option>
                    </select>
                    <input type="hidden" name="page" value="0">
            </form>

                <div style="overflow-x: auto;">
                    <table class="tabela-ranking">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nome</th>
                                <th>Pontuação</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="resultado, resultadoStat : ${ranking}"
                                th:class="${resultado.participante.id == participanteLogado.id} ? 'destaque' : ''">
                                <td th:text="${paginaAtual * tamanhoPagina + resultadoStat.index + 1}"></td>
                                <td th:text="${resultado.participante.user.username}"></td>
                                <td th:text="${resultado.pontuacao}"></td>
                                <td th:text="${#temporals.format(resultado.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="paginacao" th:if="${totalPaginas > 0}">
                    <form th:action="@{/corridas/{id}/ranking(id=${corrida.id})}" method="get">
                        <input type="hidden" name="page" value="0">
                        <input type="hidden" name="size" th:value="${tamanhoPagina}">
                        <button type="submit" class="page-btn" th:disabled="${paginaAtual == 0}">
                            &lt;&lt;
                        </button>
                    </form>

                    <form th:action="@{/corridas/{id}/ranking(id=${corrida.id})}" method="get">
                        <input type="hidden" name="page" th:value="${paginaAtual - 1}">
                        <input type="hidden" name="size" th:value="${tamanhoPagina}">
                        <button type="submit" class="page-btn" th:disabled="${paginaAtual == 0}">
                            Anterior
                        </button>
                    </form>

                    <button type="button" class="page-btn active" th:text="${paginaAtual + 1}" disabled></button>

                    <form th:action="@{/corridas/{id}/ranking(id=${corrida.id})}" method="get">
                        <input type="hidden" name="page" th:value="${paginaAtual + 1}">
                        <input type="hidden" name="size" th:value="${tamanhoPagina}">
                        <button type="submit" class="page-btn" th:disabled="${paginaAtual + 1 >= totalPaginas}">
                            Próxima
                        </button>
                    </form>

                    <form th:action="@{/corridas/{id}/ranking(id=${corrida.id})}" method="get">
                        <input type="hidden" name="page" th:value="${totalPaginas - 1}">
                        <input type="hidden" name="size" th:value="${tamanhoPagina}">
                        <button type="submit" class="page-btn" th:disabled="${paginaAtual + 1 >= totalPaginas}">
                            &gt;&gt;
                        </button>
                    </form>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
