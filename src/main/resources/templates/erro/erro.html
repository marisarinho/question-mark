<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(${tituloErro}, ~{::main})}">
<main class="pagina-erro">
    <div class="card card-erro">
        <div class="icone-erro">❔</div>
        <span class="codigo-erro" th:text="${status}">500</span>
        <h1 th:text="${tituloErro}">Ops! Algo deu errado</h1>
        <p th:text="${mensagemErro}">Não foi possível concluir a operação.</p>
        <small th:if="${caminho}" th:text="'Caminho: ' + ${caminho}"></small>

        <div class="acoes-erro">
            <button type="button" class="btn btn-secundario" onclick="history.back()">Voltar</button>
            <a th:href="@{/home}" class="btn">Ir para o início</a>
        </div>
    </div>
</main>
</html>
