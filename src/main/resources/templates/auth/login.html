<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Question Mark</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="page-wrapper">
    <div class="card">

        <div class="logo">
            <div class="logo-icon">🏁</div>
            <h1>QUESTION MARK</h1>
        </div>

        <div class="divider"></div>

        <div class="flash-erro" th:if="${param.error}">
            Utilizador ou palavra-passe inválidos. Tente novamente.
        </div>
        
        <div class="flash-ok" th:if="${param.logout}">
            Saiu do sistema com sucesso.
        </div>

        <div class="flash-ok" th:if="${mensagem}" th:text="${mensagem}"></div>

        <form th:action="@{/login}" method="post">
            
            <label for="username">Nome</label>
            <input type="text" id="username" name="username" 
                   placeholder="Digite o seu nome" required autofocus />

            <label for="password">Senha </label>
            <input type="password" id="password" name="password" 
                   placeholder="Digite a sua senha" required />

            <button class="btn btn-block" type="submit" style="margin-top: 15px;">Entrar na corrida</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9em;">
            <span style="color: var(--text-muted);">Ainda não tem conta?</span> 
            <a th:href="@{/cadastro}" style="color: var(--primary); text-decoration: none; font-weight: bold;"> Se cadastre aqui</a>
        </div>

        <div class="footer">
            Instituto Federal da Paraíba 
            <span class="badge">IFPB</span>
        </div>
    </div>
</div>

</body>
</html>
