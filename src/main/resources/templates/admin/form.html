<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Corrida - Question Mark</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="page-wrapper">
    <div class="card">
        <h2>🏁 Nova Corrida</h2>
        <div class="divider"></div>

      <form th:action="${corrida.id == null} ? @{/admin/corridas/nova} : @{/admin/corridas/{id}/editar(id=${corrida.id})}"
      method="post"
      th:object="${corrida}">

            <!-- O ID oculto essencial para a edição -->
            <input type="hidden" th:field="*{id}" />

            <label for="titulo">Título da Corrida</label>
            <input type="text" th:field="*{titulo}" placeholder="Ex: Maratona de Algoritmos" required />

            <label for="descricao">Descrição</label>
            <input type="text" th:field="*{descricao}" placeholder="Descreva as regras da corrida" required />

            <label for="tempoSegundos">Tempo (em segundos)</label>
            <input type="number" th:field="*{tempoSegundos}" placeholder="Ex: 3600 (para 1 hora)" required />

            <!-- Coloquei uma classe aqui em vez do style inline -->
            <label class="checkbox-container">
                <input type="checkbox" th:field="*{ativa}" />
                Corrida Ativa imediatamente?
            </label>

            <!-- Usando a classe btn-block para ele ficar largo -->
            <button class="btn btn-block" type="submit">Salvar Corrida</button>
           
            <!-- Usando as classes btn-secundario e btn-block do nosso CSS -->
            <a th:href="@{/admin/corridas}" class="btn btn-secundario btn-block">Cancelar</a>
        </form>

    </div>
</div>

</body>
</html>
