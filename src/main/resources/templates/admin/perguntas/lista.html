<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perguntas da Corrida</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

    <div class="acoes-topo">
        <a th:href="@{/admin/corridas}" class="btn btn-secundario">⬅ Voltar para Corridas</a>
        <a th:href="@{/admin/corridas/{id}/perguntas/nova(id=${corrida.id})}" class="btn">➕ Adicionar Pergunta</a>
    </div>

    <h2 class="titulo-pagina">
        📝 Perguntas da Corrida: <span th:text="${corrida.titulo}"></span>
    </h2>

    <div th:if="${mensagem}" class="alert-success" th:text="${mensagem}"></div>

    <div class="cards-container">
        
        <div class="card" th:each="p, iterStat : ${perguntas}">
            <h3 class="pergunta-header" th:text="'Pergunta ' + ${iterStat.index + 1}">Pergunta 1</h3>
            <p class="pergunta-enunciado" th:text="${p.enunciado}">Enunciado da pergunta vai aqui</p>
            
            <hr>

            <div class="card-acoes" style="justify-content: flex-end;">
                <a th:href="@{/admin/corridas/{cId}/perguntas/{pId}/editar(cId=${corrida.id}, pId=${p.id})}" class="btn">✏ Editar</a>
                <form th:action="@{/admin/corridas/{cId}/perguntas/{pId}/deletar(cId=${corrida.id}, pId=${p.id})}" method="post">
                    <button type="submit" class="btn btn-deletar">🗑 Excluir</button>
                </form>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(perguntas)}" class="empty-state">
            <h3>Nenhuma pergunta cadastrada ainda.</h3>
            <p>Clique no botão acima para começar a adicionar perguntas a esta corrida.</p>
        </div>

    </div>

</body>
</html>
