<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - Question Mark</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

    <div th:if="${mensagem}" class="alert-success" th:text="${mensagem}"></div>

    <div class="lobby-header">
        <h1 class="titulo-pagina" style="margin-bottom: 5px;">🏁 Lista de Corridas</h1>
        <h2 class="subtitulo">Olá, <span th:text="${nomeParticipante}"></span>! Preparado para o desafio?</h2>
        
        <div class="acoes-topo">
            <a th:href="@{/corridas/ranking}" class="btn">🏆 Ver Ranking Geral </a>
            <a th:href="@{/logout}" class="btn btn-secundario">Logout</a>
        </div>
    </div>

    <div class="cards-container">
        
        <div class="card" th:each="corrida : ${corridasAtivas}">
            
            <h2 class="pergunta-header" th:text="${corrida.titulo}">Título da Corrida</h2>
            <p class="pergunta-enunciado" th:text="${corrida.descricao}">Descrição da corrida...</p>
            
            <div class="card-detalhes">
                <span>⏱ Tempo: <b th:text="${corrida.tempoSegundos}"></b>s</span>
                <span>📝 Perguntas: <b th:text="${#lists.size(corrida.perguntas)}"></b></span>
            </div>

            <hr>

            <div class="card-acoes">
                <a th:href="@{/corridas/{id}/iniciar(id=${corrida.id})}" class="btn btn-sucesso btn-block">🚀 Iniciar Corrida</a>
                <a th:href="@{/corridas/{id}/ranking(id=${corrida.id})}" class="btn btn-block">🏆 Ranking da Corrida</a>
            </div>

        </div>

        <div th:if="${#lists.isEmpty(corridasAtivas)}" class="empty-state">
            <h3>Nenhuma corrida ativa no momento.</h3>
            <p>Aguarde o administrador liberar um novo desafio!</p>
        </div>

    </div>

</body>
</html>
